<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Музей истории Петербурга</title>
<style>
:root{--bg:#f3ecdd;--fg:#2a1f14;--card:#fffaf0;--ac:#7a2e3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a20;--fg:#e9e2d3;--card:#1f2830;--ac:#c8606e}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;min-height:100vh;box-sizing:border-box}
h1{font-size:16px;margin:4px 0;text-align:center}
#ph{width:100%;max-width:720px;height:46vh;background:var(--card);border:3px solid var(--ac);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
#ph img{max-width:100%;max-height:100%;object-fit:contain}
#ph .ph{font-size:56px;font-weight:bold;color:var(--ac)}
#cap{font-weight:bold;font-size:17px;text-align:center}
#txt{width:100%;max-width:720px;min-height:90px;background:var(--card);border:3px solid var(--ac);padding:10px;font-size:15px;line-height:1.45;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:center;justify-content:center}
button{font:bold 20px system-ui;background:var(--card);color:var(--fg);border:3px solid var(--ac);padding:12px 22px;touch-action:manipulation}
#read{background:var(--ac);color:#fff}
small{opacity:.7;font-size:11px;text-align:center}
</style></head><body>
<h1>🏛 Музей истории Санкт-Петербурга</h1>
<div id="ph"></div>
<div id="cap"></div>
<div id="txt"></div>
<div class="row"><button id="prev">◀</button><button id="read">Читать</button><button id="next">▶</button></div>
<small id="n"></small>
<small>Изображения: Wikipedia / Wikimedia Commons</small>
<script>
const E=[
{yr:'1703',n:'Основание города',t:'1703 год. На Заячьем острове заложена Петропавловская крепость. С этого года ведут историю Санкт-Петербурга.'},
{yr:'1712',n:'Новая столица',t:'1712 год. Пётр I перенёс столицу России из Москвы в Петербург.'},
{yr:'1721',n:'Российская империя',t:'1721 год. После Северной войны Пётр I принял титул императора, а Россия стала империей.'},
{yr:'1825',n:'Восстание декабристов',t:'14 (26) декабря 1825 года. Восстание на Сенатской площади. Его участников содержали в Петропавловской крепости.'},
{yr:'1861',n:'Отмена крепостного права',t:'1861 год. Император Александр II подписал манифест об отмене крепостного права.'},
{yr:'1914',n:'Петроград',t:'1914 год. В начале Первой мировой войны Петербург переименовали в Петроград.'},
{yr:'1917',n:'Революции 1917 года',t:'1917 год. В Петрограде произошли Февральская и Октябрьская революции.'},
{yr:'1918',n:'Столица возвращается в Москву',t:'1918 год. Правительство переехало в Москву, и Петроград перестал быть столицей. На этом заканчивается история, которую рассказывает экспозиция Комендантского дома (1703–1918).'}];
let i=0;const $=id=>document.getElementById(id);
function show(){const e=E[i];$('ph').innerHTML='';const im=new Image();im.alt=e.n;
 im.onerror=()=>{$('ph').innerHTML='<div class="ph">'+e.yr+'</div>'};im.src='img/'+(i+1)+'.jpg';$('ph').appendChild(im);
 $('cap').textContent=e.yr+' — '+e.n;$('txt').textContent='Нажми «Читать», чтобы узнать подробнее.';$('n').textContent=(i+1)+' / '+E.length}
const go=d=>{i=(i+d+E.length)%E.length;show()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('read').onclick=()=>{$('txt').textContent=E[i].t};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);else if(e.key===' '||e.key==='Enter')$('read').click()});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchend',e=>{if(sx!==null){const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1);sx=null}});
show();
</script></body></html>
