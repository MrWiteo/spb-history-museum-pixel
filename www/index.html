<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Музей истории Петербурга</title>
<style>
:root{--bg:#f3ecdd;--fg:#2a1f14;--card:#fffaf0;--ac:#7a2e3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a20;--fg:#e9e2d3;--card:#1f2830;--ac:#c8606e}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;min-height:100vh;box-sizing:border-box}
h1{font-size:16px;margin:4px 0;text-align:center}
#ph{width:100%;max-width:900px;height:62vh;background:var(--card);border:3px solid var(--ac);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
#ph img{max-width:100%;max-height:100%;object-fit:contain}
#ph .ph{font-size:56px;font-weight:bold;color:var(--ac)}
#cap{font-weight:bold;font-size:21px;text-align:center}
#txt{width:100%;max-width:900px;min-height:150px;background:var(--card);border:3px solid var(--ac);padding:12px;font-size:19px;line-height:1.5;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:center;justify-content:center}
button{font:bold 20px system-ui;background:var(--card);color:var(--fg);border:3px solid var(--ac);padding:12px 22px;touch-action:manipulation}
#read{background:var(--ac);color:#fff}
small{opacity:.7;font-size:11px;text-align:center}
</style></head><body>
<h1>🏛 История Музея истории Санкт-Петербурга</h1>
<div id="ph"></div>
<div id="cap"></div>
<div id="txt"></div>
<div class="row"><button id="prev">◀</button><button id="read">Читать</button><button id="next">▶</button></div>
<small id="n"></small>
<small>Изображения: Wikipedia / Wikimedia Commons</small>
<script>
const E=[{"yr": "1908", "n": "Музей Старого Петербурга", "t": "Идея городского музея возникла в 1907 году по инициативе Общества архитекторов-художников. 12 декабря 1908 года подписали «Положение о музее». Первым директором стал А. Н. Бенуа, позже его сменил П. П. Вейнер. Это был первый музей, посвящённый истории города."}, {"yr": "1910", "n": "Первая экспозиция", "t": "Музей разместился в доме П. Ю. Сюзора на Кадетской линии, 21, и десять лет находился там. Сюзор отдал музею свой дом и значительную часть коллекций. В 1910 году для посетителей открыли первую экспозицию, а к 1916 году в собрании было около 2300 предметов."}, {"yr": "1908", "n": "Музей Городской управы", "t": "Почти одновременно появился ещё один музей — Городской управы. Он размещался в Доме городских учреждений на Садовой улице, 55, но так и не был открыт для публики."}, {"yr": "1918", "n": "Музей Города", "t": "Музей Города создали в Петрограде на основе декрета Наркомата просвещения от 4 октября 1918 года, который подписал А. В. Луначарский. Ещё весной 1918 года была создана комиссия, которую возглавил В. Р. Менжинский, — она готовила задачи и организацию музея."}, {"yr": "1918–1928", "n": "Лев Ильин", "t": "Директором музея в декабре 1918 года назначили Л. А. Ильина. В 1918–1928 годах он руководил музеем, и благодаря его усилиям Музей Города стал одним из крупнейших научных центров Петрограда–Ленинграда 1920-х годов. В конце 1918 года Музей Старого Петербурга стал его филиалом."}, {"yr": "1918", "n": "Аничков дворец", "t": "Музей Города разместили в Аничковом дворце, а Музей Старого Петербурга стал его филиалом на набережной Фонтанки, 35."}, {"yr": "1938", "n": "Музей истории Ленинграда", "t": "В 1938 году в Особняке Румянцева создали Музей истории и развития Ленинграда. В его состав включили здания Петропавловской крепости: Великокняжескую усыпальницу, Ботный дом, бастионы Зотов и Трубецкой."}, {"yr": "1991", "n": "Новое название", "t": "Когда Ленинграду вернули прежнее имя (город переименовали в 1991 году), музей получил название, которое носит и сейчас: Государственный музей истории Санкт-Петербурга."}, {"yr": "Крепость", "n": "Главная площадка музея", "t": "Основная часть фондов находится в Петропавловской крепости на Заячьем острове. Здесь доминирует Петропавловский собор — памятник XVIII века, символ города и место упокоения императорской семьи Романовых."}, {"yr": "Комендантский дом", "n": "Экспозиция 1703–1918", "t": "Здесь проходит экспозиция «История Санкт-Петербурга — Петрограда. 1703–1918» с интерактивными экспонатами. Раньше в этом доме жил смотритель крепости."}, {"yr": "Особняк Румянцева", "n": "Блокадная экспозиция", "t": "В Особняке Румянцева, где в 1938 году создали музей истории Ленинграда, сегодня работает филиал музея с блокадной экспозицией."}, {"yr": "Сегодня", "n": "Более 1,3 млн экспонатов", "t": "В собрании музея более 1 300 000 экспонатов. В его состав входят Музей-квартира Блока, Музей печати, Музей авангарда, Шлиссельбургская крепость Орешек, Музей С. М. Кирова и другие."}, {"yr": "Орешек", "n": "Крепость Орешек", "t": "Шлиссельбургская крепость Орешек — один из филиалов музея. До неё можно добраться на «Метеоре» из Петербурга."}, {"yr": "Даты", "n": "Какой год считать основанием?", "t": "Источники называют разные даты основания: 1908 (Музей Старого Петербурга), 1918 (Музей Города) и 1938 (Музей истории и развития Ленинграда). Поэтому в справочниках встречаются разные годы."}];
let i=0;const $=id=>document.getElementById(id);
function show(){const e=E[i];$('ph').innerHTML='';const im=new Image();im.alt=e.n;
 im.onerror=()=>{$('ph').innerHTML='<div class="ph">'+e.yr+'</div>'};im.src='img/'+(i+1)+'.jpg';$('ph').appendChild(im);
 $('cap').textContent=e.yr+' — '+e.n;$('txt').textContent='Нажми «Читать», чтобы прочитать подробнее.';$('n').textContent=(i+1)+' / '+E.length}
const go=d=>{i=(i+d+E.length)%E.length;show()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('read').onclick=()=>{$('txt').textContent=E[i].t};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);else if(e.key===' '||e.key==='Enter')$('read').click()});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchend',e=>{if(sx!==null){const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1);sx=null}});
show();
</script></body></html>
